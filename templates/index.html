<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app-shell">
        <section class="calculator" aria-label="Calculator">
            <header class="calc-header">
                <span class="brand">Flask Calc</span>
                <span class="hint">Keyboard supported</span>
            </header>

            <div class="display" role="region" aria-live="polite">
                <div id="expression" class="expression">0</div>
                <div id="result" class="result"></div>
            </div>

            <div class="keypad">
                <button type="button" class="btn btn-utility" data-action="clear">C</button>
                <button type="button" class="btn btn-utility" data-action="backspace" aria-label="Backspace">⌫</button>
                <button type="button" class="btn btn-utility" data-value="(">(</button>
                <button type="button" class="btn btn-utility" data-value=")">)</button>

                <button type="button" class="btn btn-num" data-value="7">7</button>
                <button type="button" class="btn btn-num" data-value="8">8</button>
                <button type="button" class="btn btn-num" data-value="9">9</button>
                <button type="button" class="btn btn-op" data-value="÷">÷</button>

                <button type="button" class="btn btn-num" data-value="4">4</button>
                <button type="button" class="btn btn-num" data-value="5">5</button>
                <button type="button" class="btn btn-num" data-value="6">6</button>
                <button type="button" class="btn btn-op" data-value="×">×</button>

                <button type="button" class="btn btn-num" data-value="1">1</button>
                <button type="button" class="btn btn-num" data-value="2">2</button>
                <button type="button" class="btn btn-num" data-value="3">3</button>
                <button type="button" class="btn btn-op" data-value="−">−</button>

                <button type="button" class="btn btn-num" data-value="0">0</button>
                <button type="button" class="btn btn-num" data-value=".">.</button>
                <button type="button" class="btn btn-op" data-value="%">%</button>
                <button type="button" class="btn btn-op" data-value="+">+</button>

                <button type="button" class="btn btn-utility" data-action="toggle-sign">±</button>
                <button type="button" class="btn btn-op" data-value="**">xʸ</button>
                <button type="button" class="btn btn-equals span-two" data-action="equals">=</button>
            </div>
        </section>

        <aside class="history-panel" aria-label="Calculation history">
            <div class="history-header">
                <h2>History</h2>
                <button type="button" id="clear-history" class="clear-history">Clear</button>
            </div>
            <ul id="history-list" class="history-list">
                <li class="history-empty">No calculations yet</li>
            </ul>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
